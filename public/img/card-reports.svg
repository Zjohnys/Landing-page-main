<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8eef5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardBlue2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b5876;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3c72;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="500" height="400" fill="url(#cardBg2)"/>
  
  <!-- Main container -->
  <g transform="translate(50, 40)">
    <!-- Header card -->
    <rect x="0" y="0" width="400" height="80" rx="12" fill="white" stroke="url(#cardBlue2)" stroke-width="2" opacity="0.9"/>
    
    <!-- Icon - Chart -->
    <g transform="translate(45, 25)">
      <rect x="0" y="0" width="50" height="50" rx="8" fill="url(#cardBlue2)" opacity="0.15"/>
      <!-- Bar chart -->
      <g fill="url(#cardBlue2)" transform="translate(10, 10)">
        <rect x="5" y="25" width="6" height="20" rx="2"/>
        <rect x="15" y="10" width="6" height="35" rx="2"/>
        <rect x="25" y="18" width="6" height="27" rx="2"/>
      </g>
      <polyline points="11,25 17,15 27,20" fill="none" stroke="url(#cardBlue2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
    </g>
    
    <!-- Text -->
    <text x="110" y="28" font-size="18" font-weight="bold" fill="url(#cardBlue2)">Relatórios Inteligentes</text>
    <text x="110" y="50" font-size="12" font-weight="500" fill="#666">Análise de dados</text>
    <text x="110" y="62" font-size="11" fill="#999">Decisões com base em informações</text>
    
    <!-- Items list -->
    <g transform="translate(0, 110)">
      <g transform="translate(0, 0)">
        <circle cx="15" cy="10" r="4" fill="url(#cardBlue2)" opacity="0.7"/>
        <text x="35" y="15" font-size="13" fill="#333">Gráficos em tempo real</text>
      </g>
      <g transform="translate(0, 30)">
        <circle cx="15" cy="10" r="4" fill="url(#cardBlue2)" opacity="0.7"/>
        <text x="35" y="15" font-size="13" fill="#333">Tendências de vendas</text>
      </g>
      <g transform="translate(0, 60)">
        <circle cx="15" cy="10" r="4" fill="url(#cardBlue2)" opacity="0.7"/>
        <text x="35" y="15" font-size="13" fill="#333">Exportar relatórios</text>
      </g>
    </g>
  </g>
  
  <!-- Accent shapes -->
  <rect x="320" y="320" width="80" height="50" rx="8" fill="url(#cardBlue2)" opacity="0.08"/>
  <circle cx="80" cy="350" r="20" fill="none" stroke="url(#cardBlue2)" stroke-width="2" opacity="0.15"/>
</svg>