<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f4f8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f9ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b5876;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3c72;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="500" height="500" fill="url(#bgGradient)"/>
  
  <!-- Laptop/Dashboard -->
  <g transform="translate(100, 120)">
    <!-- Screen -->
    <rect x="0" y="0" width="300" height="200" rx="12" fill="white" stroke="url(#primaryGrad)" stroke-width="3"/>
    
    <!-- Screen content - bars -->
    <g fill="url(#primaryGrad)" opacity="0.8">
      <rect x="20" y="20" width="40" height="60" rx="4"/>
      <rect x="75" y="35" width="40" height="45" rx="4"/>
      <rect x="130" y="15" width="40" height="65" rx="4"/>
      <rect x="185" y="40" width="40" height="40" rx="4"/>
      <rect x="240" y="25" width="40" height="55" rx="4"/>
    </g>
    
    <!-- Grid pattern -->
    <g stroke="#e0e0e0" stroke-width="1" opacity="0.5">
      <line x1="20" y1="100" x2="260" y2="100"/>
      <line x1="20" y1="120" x2="260" y2="120"/>
      <line x1="20" y1="140" x2="260" y2="140"/>
      <line x1="20" y1="160" x2="260" y2="160"/>
    </g>
    
    <!-- Stand -->
    <rect x="110" y="200" width="80" height="15" rx="4" fill="url(#primaryGrad)"/>
    <rect x="130" y="215" width="40" height="25" rx="4" fill="url(#primaryGrad)" opacity="0.7"/>
  </g>
  
  <!-- Floating elements -->
  <g opacity="0.6" transform="translate(30, 80)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#2b5876" stroke-width="2"/>
    <circle cx="8" cy="-8" r="4" fill="#2b5876"/>
  </g>
  
  <g opacity="0.6" transform="translate(430, 380)">
    <rect x="-20" y="-20" width="40" height="40" rx="6" fill="none" stroke="#2b5876" stroke-width="2"/>
    <rect x="-12" y="-12" width="8" height="8" fill="#2b5876"/>
    <rect x="-12" y="4" width="8" height="8" fill="#2b5876"/>
    <rect x="4" y="-12" width="8" height="8" fill="#2b5876"/>
    <rect x="4" y="4" width="8" height="8" fill="#2b5876"/>
  </g>
  
  <!-- Checkmarks -->
  <g fill="none" stroke="#4CAF50" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="380,150 395,165 415,130"/>
    <polyline points="80,420 92,432 112,400"/>
  </g>
</svg>