<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8eef5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardBlue3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b5876;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3c72;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="500" height="400" fill="url(#cardBg3)"/>
  
  <!-- Main container -->
  <g transform="translate(50, 40)">
    <!-- Header card -->
    <rect x="0" y="0" width="400" height="80" rx="12" fill="white" stroke="url(#cardBlue3)" stroke-width="2" opacity="0.9"/>
    
    <!-- Icon - Headset/Support -->
    <g transform="translate(45, 25)">
      <rect x="0" y="0" width="50" height="50" rx="8" fill="url(#cardBlue3)" opacity="0.15"/>
      <!-- Headset -->
      <g fill="none" stroke="url(#cardBlue3)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <!-- Ears -->
        <circle cx="12" cy="18" r="5" fill="none" stroke="url(#cardBlue3)" stroke-width="2"/>
        <circle cx="28" cy="18" r="5" fill="none" stroke="url(#cardBlue3)" stroke-width="2"/>
        <!-- Band -->
        <path d="M 12 13 Q 20 5 28 13"/>
        <!-- Mic -->
        <line x1="20" y1="28" x2="20" y2="35"/>
        <circle cx="20" cy="38" r="3"/>
      </g>
    </g>
    
    <!-- Text -->
    <text x="110" y="28" font-size="18" font-weight="bold" fill="url(#cardBlue3)">Suporte Especializado</text>
    <text x="110" y="50" font-size="12" font-weight="500" fill="#666">Atendimento dedicado</text>
    <text x="110" y="62" font-size="11" fill="#999">Equipe disponível 24h</text>
    
    <!-- Items list -->
    <g transform="translate(0, 110)">
      <g transform="translate(0, 0)">
        <circle cx="15" cy="10" r="4" fill="url(#cardBlue3)" opacity="0.7"/>
        <text x="35" y="15" font-size="13" fill="#333">Chat ao vivo</text>
      </g>
      <g transform="translate(0, 30)">
        <circle cx="15" cy="10" r="4" fill="url(#cardBlue3)" opacity="0.7"/>
        <text x="35" y="15" font-size="13" fill="#333">Email prioritário</text>
      </g>
      <g transform="translate(0, 60)">
        <circle cx="15" cy="10" r="4" fill="url(#cardBlue3)" opacity="0.7"/>
        <text x="35" y="15" font-size="13" fill="#333">Base de conhecimento</text>
      </g>
    </g>
  </g>
  
  <!-- Accent shapes -->
  <g opacity="0.15">
    <circle cx="430" cy="60" r="25" fill="none" stroke="url(#cardBlue3)" stroke-width="2"/>
    <circle cx="430" cy="60" r="18" fill="none" stroke="url(#cardBlue3)" stroke-width="1"/>
  </g>
  <polygon points="100,320 120,340 80,340" fill="url(#cardBlue3)" opacity="0.1"/>
</svg>