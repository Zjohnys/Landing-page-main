<svg viewBox="0 0 500 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8eef5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2b5876;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3c72;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="500" height="400" fill="url(#cardBg)"/>
  
  <!-- Main container -->
  <g transform="translate(50, 40)">
    <!-- Header card -->
    <rect x="0" y="0" width="400" height="80" rx="12" fill="white" stroke="url(#cardBlue)" stroke-width="2" opacity="0.9"/>
    
    <!-- Icon - Folder/Database -->
    <g transform="translate(45, 35)">
      <rect x="0" y="0" width="50" height="50" rx="8" fill="url(#cardBlue)" opacity="0.15"/>
      <g fill="url(#cardBlue)" stroke-width="2" stroke="url(#cardBlue)">
        <!-- Folder icon -->
        <path d="M 12 10 L 12 35 L 38 35 L 38 10 Z" fill="none" stroke="url(#cardBlue)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M 12 15 L 20 15" stroke="url(#cardBlue)" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Document -->
        <circle cx="25" cy="22" r="3" fill="url(#cardBlue)"/>
        <line x1="25" y1="27" x2="25" y2="30" stroke="url(#cardBlue)" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    
    <!-- Text -->
    <text x="110" y="28" font-size="18" font-weight="bold" fill="url(#cardBlue)">Controle Digital</text>
    <text x="110" y="50" font-size="12" font-weight="500" fill="#666">Estoque inteligente</text>
    <text x="110" y="62" font-size="11" fill="#999">Gerenciamento em tempo real</text>
    
    <!-- Items list -->
    <g transform="translate(0, 110)">
      <g transform="translate(0, 0)">
        <circle cx="15" cy="10" r="4" fill="url(#cardBlue)" opacity="0.7"/>
        <text x="35" y="15" font-size="13" fill="#333">Cadastro de produtos</text>
      </g>
      <g transform="translate(0, 30)">
        <circle cx="15" cy="10" r="4" fill="url(#cardBlue)" opacity="0.7"/>
        <text x="35" y="15" font-size="13" fill="#333">Controle de quantidade</text>
      </g>
      <g transform="translate(0, 60)">
        <circle cx="15" cy="10" r="4" fill="url(#cardBlue)" opacity="0.7"/>
        <text x="35" y="15" font-size="13" fill="#333">Alertas automáticos</text>
      </g>
    </g>
  </g>
  
  <!-- Accent shapes -->
  <circle cx="420" cy="30" r="15" fill="url(#cardBlue)" opacity="0.1"/>
  <rect x="20" y="300" width="60" height="60" rx="8" fill="none" stroke="url(#cardBlue)" stroke-width="2" opacity="0.2"/>
</svg>